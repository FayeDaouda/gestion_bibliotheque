<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue à la Bibliothèque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #2C3E50;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .welcome-container {
            max-width: 800px;
            margin: auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .auth-links {
            margin-top: 20px;
            text-align: center;
        }
        .auth-links a {
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <h1>Bienvenue à la Bibliothèque</h1>

        {% if current_user.is_authenticated %}
            <p>Bonjour, {{ current_user.username }}!</p>

            {% if current_user.role == 'admin' %}
                <p><a href="{{ url_for('admin_dashboard') }}">Tableau de bord de l'admin</a></p>
            {% else %}
                <p><a href="{{ url_for('client_dashboard') }}">Tableau de bord du client</a></p>
            {% endif %}

            <p><a href="{{ url_for('logout') }}">Se déconnecter</a></p>
        {% else %}
            <div class="auth-links">
                <p><a href="{{ url_for('login') }}">Se connecter</a> ou <a href="{{ url_for('register') }}">S'inscrire</a></p>
            </div>
        {% endif %}
    </div>

</body>
</html>
