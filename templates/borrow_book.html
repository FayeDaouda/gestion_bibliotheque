<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emprunter le livre</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 50px auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #2c3e50;
            text-decoration: none;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .book-info {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .book-info p {
            margin: 5px 0;
        }

        .info-label {
            font-weight: bold;
            color: #34495e;
        }

        .info-value {
            color: #7f8c8d;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Emprunter le livre : {{ book.title }}</h1>
        
        <div class="book-info">
            <p><span class="info-label">Auteur :</span> <span class="info-value">{{ book.author }}</span></p>
            <p><span class="info-label">Disponible :</span> <span class="info-value">{{ book.available }} exemplaires</span></p>
        </div>

        <form method="POST">
            <button type="submit" class="btn">Emprunter ce livre</button>
        </form>

        <br>
        <a href="{{ url_for('client_dashboard') }}" class="back-link">Retourner au tableau de bord</a>
    </div>

</body>
</html>
